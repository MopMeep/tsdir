[package]
name = "tsdir"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/opencode/tsdir"
description = "Create directories with timestamp suffix for sandbox experiments"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }